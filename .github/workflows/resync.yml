name: resync

# Regenerate the fork from a newer upstream pi-blackhole release and open a PR.
# Runs weekly and on demand. The PR is the review point — this workflow NEVER
# merges, and needs no secrets beyond the built-in GITHUB_TOKEN.

on:
  schedule:
    # Mondays 08:00 UTC — weekday morning, off pipeline peak.
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream pi-blackhole version to resync to (empty = latest on npm)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  resync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the major.minor the pipeline and tests-omp were verified on.
          bun-version: "1.3"

      - name: Resolve target version
        id: target
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The fork's current upstream base is derived from package.json:
          # "version" is exactly "<base>-omp.<N>", bumped by every resync. We
          # read it from there rather than checking in a separate
          # patches/base-version.txt — one file already holds the fact, and a
          # second would be one more thing a resync can forget to update.
          base="$(jq -r '.version' package.json | sed -E 's/-omp\.[0-9]+$//')"
          if [ -n "$INPUT_VERSION" ]; then
            target="$INPUT_VERSION"
          else
            # ubuntu-latest ships npm; dist-tags.latest is the registry answer.
            target="$(npm view pi-blackhole version)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "version=$target" >> "$GITHUB_OUTPUT"
          if [ "$target" = "$base" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Fork is already based on pi-blackhole $target — nothing to resync."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Fork base $base -> target $target."
          fi

      # apply.ts fetches the npm tarball for --version, asserts each patch's
      # preconditions (non-zero exit if upstream reshaped a patched region —
      # that shows up as a red check, never as a silently stale fork), writes
      # the result over the repo root, and runs the standalone tests itself.
      - name: Apply patch pipeline
        if: steps.target.outputs.skip != 'true'
        run: bun patches/apply.ts --version "${{ steps.target.outputs.version }}"

      # Redundant with the test run inside apply.ts by design: keeps failure
      # attribution unambiguous if the pipeline is later stopped before tests.
      - name: Standalone tests
        if: steps.target.outputs.skip != 'true'
        run: bun test tests-omp/ patches/

      - name: Open resync PR
        if: steps.target.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: resync/${{ steps.target.outputs.version }}
          delete-branch: true
          commit-message: "chore: resync to pi-blackhole ${{ steps.target.outputs.version }}"
          title: "chore: resync to pi-blackhole ${{ steps.target.outputs.version }}"
          body: |
            Automated resync: the fork was regenerated from the npm tarball of `pi-blackhole@${{ steps.target.outputs.version }}` via `bun patches/apply.ts --version ${{ steps.target.outputs.version }}`, and `bun test tests-omp/ patches/` passed on the result. Any patch that upstream has since fixed reports itself as retired in the run log; a patch whose target was reshaped fails the run instead of guessing.

            - Fork base before this run: `${{ steps.target.outputs.base }}`
            - New target: `${{ steps.target.outputs.version }}`

            Review the diff before merging: `apply.ts` fails loudly when a patched region moved shape, but semantic changes *inside* the patched regions still need a human.

      - name: Already in sync
        if: steps.target.outputs.skip == 'true'
        run: echo "No PR opened — resolved version equals the fork's base (${{ steps.target.outputs.version }})."
